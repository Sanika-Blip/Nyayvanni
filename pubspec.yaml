name: nyayvaani
description: "AI Multilingual Police Documentation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # IDs
  uuid: ^4.4.0

  # Auth (HTTP + local storage)
  http: ^1.2.1
  shared_preferences: ^2.3.1

  # Speech to text
  speech_to_text: ^7.0.0

  # Permissions (microphone etc.)
  permission_handler: ^11.3.1

  # PDF generation & printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Share files/text
  share_plus: ^10.1.4 

  # Date formatting
  intl: ^0.19.0

  # Temporary files for PDF export
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true